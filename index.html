<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Open This Please 💖</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .card {
      background: #fff;
      width: 90%;
      max-width: 360px;
      padding: 30px 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 25px;
      color: #333;
    }

    p {
      font-size: 16px;
      color: #555;
      line-height: 1.5;
    }

    .buttons {
      position: relative;
      height: 70px;
      margin-top: 20px;
    }

    button {
      padding: 14px 24px;
      font-size: 16px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      position: absolute;
      transition: all 0.25s ease;
    }

    .yes {
      background: #ff4d6d;
      color: white;
      left: 0;
    }

    .no {
      background: #e0e0e0;
      color: #333;
      right: 0;
    }

    .hearts {
      font-size: 28px;
      margin-bottom: 10px;
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      from { transform: scale(0.6); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>

<body>

  <div class="card" id="card">
    <h1>Drishti, will you be my Valentine? 💖</h1>
    <div class="buttons">
      <button class="yes" onclick="nextStep()">Yes 💕</button>
      <button class="no" id="noBtn">No 🙃</button>
    </div>
  </div>

  <script>
    let step = 1;
    let scale = 1;

    const card = document.getElementById("card");
    const noBtn = document.getElementById("noBtn");

    // 😈 No button behavior
    noBtn.addEventListener("click", () => {
      scale -= 0.15;
      if (scale < 0.3) scale = 0.3;

      const x = Math.random() * 140 - 70;
      const y = Math.random() * 120 - 60;

      noBtn.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    });

    function nextStep() {
      step++;

      if (step === 2) {
        card.innerHTML = `
          <h1>Are you REALLY sure? 😏</h1>
          <div class="buttons">
            <button class="yes" onclick="nextStep()">Hmm… maybe 💭</button>
            <button class="no" onclick="shrinkNo(this)">Still no 😐</button>
          </div>
        `;
      }

      else if (step === 3) {
        card.innerHTML = `
          <h1>Last chance 👀</h1>
          <div class="buttons">
            <button class="yes" onclick="nextStep()">Okay fine 😌</button>
            <button class="no" onclick="shrinkNo(this)">Nope 🙄</button>
          </div>
        `;
      }

      else {
        card.innerHTML = `
          <div class="hearts">💖💖💖</div>
          <h1>Drishti 🥰</h1>
          <p>
            YAYYYY!!!! You just made my day! You know I’m bad at balancing things,<br>
            but I’m good at loving you ❤️
          </p>
        `;
      }
    }

    function shrinkNo(btn) {
      btn.style.transform = "scale(0.7)";
    }
  </script>

</body>
</html>
