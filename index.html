<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Me 🎁</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  margin:0;
  height:100vh;
  background:linear-gradient(135deg,#ffe1ea,#ffd6f3);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.card{
  background:white;
  width:90%;
  max-width:360px;
  padding:30px 20px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.2);
}

h1{
  font-size:22px;
  margin-bottom:25px;
  color:#333;
}

p{
  font-size:16px;
  color:#555;
  line-height:1.5;
}

button{
  padding:14px 26px;
  font-size:16px;
  border:none;
  border-radius:30px;
  background:#ff4d6d;
  color:white;
  cursor:pointer;
  transition:0.2s;
}

button:active{
  transform:scale(0.95);
}

.confetti, .balloon{
  position:absolute;
  font-size:22px;
  animation:fall linear infinite;
}

@keyframes fall{
  0%{transform:translateY(-10vh);}
  100%{transform:translateY(110vh);}
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1>Hey you 👀</h1>
  <p>I made a tiny surprise for you…</p>
  <button onclick="nextStep()">Open it 🎁</button>
</div>

<script>
let step = 0;
const card = document.getElementById("card");

function nextStep(){
  step++;

  if(step===1){
    card.innerHTML=`
      <h1>But first…</h1>
      <p>Promise you won’t skip? 😏</p>
      <button onclick="nextStep()">Promise 🤞</button>
    `;
  }

  else if(step===2){
    card.innerHTML=`
      <h1>Good 😌</h1>
      <p>Because you deserve nice things.</p>
      <button onclick="nextStep()">Continue ✨</button>
    `;
  }

  else if(step===3){
    card.innerHTML=`
      <h1>One more thing…</h1>
      <p>I’m always around if you need me.</p>
      <button onclick="nextStep()">Okay 🫶</button>
    `;
  }

  else{
    card.innerHTML=`
      <h1>Happy Birthday Cutu 🎂</h1>
      <p><b>Cutest is you, always too 😌</b></p>
    `;
    startCelebration();
  }
}

function startCelebration(){
  for(let i=0;i<30;i++){
    createEmoji("🎉");
    createEmoji("🎈");
  }
}

function createEmoji(symbol){
  const el=document.createElement("div");
  el.classList.add("confetti");
  el.innerText=symbol;
  el.style.left=Math.random()*100+"vw";
  el.style.animationDuration=(Math.random()*3+3)+"s";
  document.body.appendChild(el);

  setTimeout(()=>{el.remove();},6000);
}
</script>

</body>
</html>
